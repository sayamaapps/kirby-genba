# Public-repo name check: fails when a file, a commit message, the PR text or the
# branch name contains a term from the internal list. The list is a repository secret.
name: namenswache

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  push:

permissions:
  contents: read

jobs:
  namenswache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prüfung
        env:
          NAMENSWACHE_BEGRIFFE: ${{ secrets.NAMENSWACHE_BEGRIFFE }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/oeffentlich/namenswache-ci.py
